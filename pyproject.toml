[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "epsiloneridani"
dynamic = ["version"]
description = "Autonomous worker for the eic/EpsilonEridani Lean library"
requires-python = ">=3.11"
dependencies = [
    "epsiloneridani-progress>=0.1.0",
    "epsiloneridani-review>=0.1.0",
    "rich>=13",
    "textual>=8,<9",
]

[tool.hatch.version]
source = "vcs"

[project.scripts]
epsiloneridani = "epsiloneridani_worker.cli:cli_main"
tauceti = "epsiloneridani_worker.cli:cli_main"

# The worker is the epsiloneridani_worker/ package. Its prompts/ and scripts/ wrappers live at the repo
# root for the `./epsiloneridani` shim (HERE resolves to the repo root in a checkout); the wheel bundles
# them INTO the package (epsiloneridani_worker/{prompts,scripts}) so the same `HERE / "prompts"` lookup
# works once installed (HERE then resolves to the package dir — see epsiloneridani_worker/paths.py).
[tool.hatch.build.targets.wheel]
packages = ["epsiloneridani_worker"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "epsiloneridani_worker/prompts"
"scripts" = "epsiloneridani_worker/scripts"

[tool.ruff]
target-version = "py311"
line-length = 120
# `epsiloneridani` is the program but has no .py extension, so ruff won't pick it up by default.
extend-include = ["epsiloneridani"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line length): the formatter owns code width; long inline comments/URLs are left intact.
# UP031 (printf-format): the tests build jq/JSON filter strings with literal braces, where
#   percent-format is clearer than f-strings that would have to escape every brace.
ignore = ["E501", "UP031"]

[tool.ruff.lint.per-file-ignores]
# The ./epsiloneridani shim must put the checkout on sys.path before importing the package, so its
# `from epsiloneridani_worker.cli import ...` deliberately follows a statement (E402).
"epsiloneridani" = ["E402"]
# Each test puts the repo root on sys.path before `import epsiloneridani_worker as tc`, so the package
# import deliberately follows statements (E402).
"tests/*" = ["E402"]
