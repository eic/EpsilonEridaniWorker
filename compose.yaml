name: epsiloneridani-worker

services:
  epsiloneridani:
    build:
      context: .
    image: epsiloneridani-worker:local
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    command: ["./epsiloneridani", "work", "--loop"]
    environment:
      TAUCETI_WORKER_ID: docker
      TAUCETI_WORKER_ARGS: "${TAUCETI_WORKER_ARGS:-}"
      KIRO_API_KEY: "${KIRO_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MANAGEMENT_KEY: "${OPENROUTER_MANAGEMENT_KEY:-}"
    volumes:
      # Agent and GitHub subscription credentials, created by the one-time login step.
      - claude-worker:/root/.claude:ro
      - codex-worker:/root/.codex:ro
      - kiro:/root/.local/share/kiro-cli:ro
      - gh:/root/.config/gh
      # Preserve build downloads when the image or isolated worker HOME changes. The pinned
      # Lean toolchain remains image-owned so an image update cannot be hidden by a stale volume.
      - uv-cache:/root/.cache/uv
      # Checkouts, scheduler state, and durable per-round logs.
      - checkouts:/opt/epsiloneridani/checkouts
      - state:/opt/epsiloneridani/state
      - logs:/opt/epsiloneridani/logs

  # Explicit setup runner: unlike the worker, this service mounts credentials read-write.
  # Run it only for the documented one-time login commands, never as a long-running service.
  auth:
    image: epsiloneridani-worker:local
    profiles: [setup]
    stdin_open: true
    tty: true
    command: ["bash"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
    volumes:
      - claude:/root/.claude
      - codex:/root/.codex
      - kiro:/root/.local/share/kiro-cli
      - gh:/root/.config/gh

  # These are the only processes allowed to rotate each provider's shared refresh token.
  # EpsilonEridani's isolated worker home mirrors their access tokens, avoiding refresh-token races.
  claude-refresh:
    image: epsiloneridani-worker:local
    init: true
    restart: unless-stopped
    # Exceed the refresher's 15-second HTTP timeout so Docker cannot kill it after
    # the server rotates a token but before the replacement is persisted.
    stop_grace_period: 60s
    command: ["/usr/local/bin/epsiloneridani-oauth-refresh", "claude"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
      TAUCETI_REFRESH_MIRROR: /worker-credentials/.credentials.json
    volumes:
      - claude:/root/.claude
      - claude-worker:/worker-credentials

  codex-refresh:
    image: epsiloneridani-worker:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["/usr/local/bin/epsiloneridani-oauth-refresh", "codex"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
      TAUCETI_REFRESH_MIRROR: /worker-credentials/auth.json
    volumes:
      - codex:/root/.codex
      - codex-worker:/worker-credentials

volumes:
  claude:
  codex:
  claude-worker:
  codex-worker:
  kiro:
  gh:
  uv-cache:
  checkouts:
  state:
  logs:
